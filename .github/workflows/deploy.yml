name: Deploy Experiments--Data-Cleansing-with-SGD

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        default: dev
        options: [dev, prod]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore file timestamps
        run: git ls-files -z | xargs -0 -I{} bash -c 'touch -d "$(git log -1 --format="%cI" -- "{}")" "{}" 2>/dev/null || true'

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SAKURA_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SAKURA_HOST }}" >> ~/.ssh/known_hosts

      - name: Resolve environment
        id: env
        run: |
          ENV="${{ github.event.inputs.environment }}"
          if [ -z "$ENV" ]; then
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              ENV=prod
            else
              ENV=dev
            fi
          fi
          echo "env=$ENV" >> "$GITHUB_OUTPUT"

      - name: Deploy dev
        run: |
          ssh "${{ secrets.SAKURA_USER }}@${{ secrets.SAKURA_HOST }}" "mkdir -p ~/dev/Experiments--Data-Cleansing-with-SGD/"
          rsync -avz --delete --chmod=F644,D755 --exclude '.DS_Store' site/ "${{ secrets.SAKURA_USER }}@${{ secrets.SAKURA_HOST }}:~/dev/Experiments--Data-Cleansing-with-SGD/"

      - name: Smoke dev (expect 401)
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' https://orbital-q.sakura.ne.jp/dev/Experiments--Data-Cleansing-with-SGD/)
          [ "$status" = "401" ] || exit 1

      - name: Deploy prod
        if: steps.env.outputs.env == 'prod'
        run: |
          ssh "${{ secrets.SAKURA_USER }}@${{ secrets.SAKURA_HOST }}" "mkdir -p ~/www/Experiments--Data-Cleansing-with-SGD/"
          rsync -avz --delete --chmod=F644,D755 --exclude '.DS_Store' site/ "${{ secrets.SAKURA_USER }}@${{ secrets.SAKURA_HOST }}:~/www/Experiments--Data-Cleansing-with-SGD/"

      - name: Smoke prod (expect 200)
        if: steps.env.outputs.env == 'prod'
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' https://orbital-q.sakura.ne.jp/Experiments--Data-Cleansing-with-SGD/)
          [ "$status" = "200" ] || exit 1
