<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Cleansing with SGD</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 1200px;
      height: 800px;
      margin: 0;
      overflow: hidden;
      background: #fff;
    }

    body {
      display: flex;
      align-items: center;
      font-family: Charter, Georgia, serif;
      color: #202020;
    }

    main {
      width: 100%;
      margin: 0 112px;
    }

    h1 {
      max-width: 900px;
      margin: 0;
      font-size: 86px;
      font-weight: 600;
      line-height: 1.03;
      letter-spacing: -2.5px;
    }

    h1 span {
      color: #3E6C99;
    }

    .detail {
      width: 74px;
      height: 5px;
      margin-top: 34px;
      background: #B0521D;
    }

    hr {
      margin: 44px 0 28px;
      border: 0;
      border-top: 1px solid #b9b9b9;
    }

    p {
      margin: 0;
      font-size: 30px;
      line-height: 1.35;
      color: #565656;
    }
  </style>
</head>
<body>
  <main>
    <h1>Data Cleansing with <span>SGD</span></h1>
    <div class="detail"></div>
    <hr>
    <p>Reproduction &amp; Bug-Fix Study — NeurIPS 2019</p>
  </main>
</body>
</html>
