<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thumbnail candidates</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #1a1a1a;
      font-family: Georgia, "Times New Roman", serif;
    }
    main { width: min(1160px, calc(100% - 48px)); margin: 48px auto 64px; }
    h1 { margin: 0 0 32px; font-size: 36px; }
    .gallery { display: grid; grid-template-columns: repeat(3, 360px); gap: 34px 28px; }
    figure { margin: 0; width: 360px; }
    img { display: block; width: 360px; height: 240px; border: 1px solid #ddd; object-fit: contain; }
    figcaption { margin-top: 10px; font-family: Arial, sans-serif; font-size: 14px; line-height: 1.4; color: #666; }
    .label { margin-right: 7px; color: #3e6c99; font-weight: 700; }
    .square-candidates { margin-top: 48px; }
    .square-candidates h2 { margin: 0 0 20px; font-size: 28px; }
    .square-gallery { display: grid; grid-template-columns: repeat(3, 300px); gap: 34px 28px; }
    .square-gallery figure { width: 300px; }
    .square-gallery img { width: 300px; height: 300px; object-fit: cover; border-radius: 6px; }
    @media (max-width: 1160px) { .gallery { grid-template-columns: repeat(2, 360px); } }
    @media (max-width: 1000px) { .square-gallery { grid-template-columns: repeat(2, 300px); } }
    @media (max-width: 790px) { .gallery { grid-template-columns: 360px; } }
    @media (max-width: 680px) { .square-gallery { grid-template-columns: 300px; } }
  </style>
</head>
